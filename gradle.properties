# Réglages de la compilation (lus par Gradle sur GitHub).
# L'app a grandi : avec la mémoire par défaut, le compilateur Kotlin finissait par en manquer
# (« OutOfMemoryError: GC overhead limit exceeded »). On lui en donne davantage.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
