name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Recréer la clé de signature
        run: base64 -d app/debug.keystore.b64 > app/debug.keystore

      - name: Compiler
        run: gradle assembleDebug

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version -y --cleanup-tag || true
          gh release create derniere-version app/build/outputs/apk/debug/app-debug.apk --title "Dernière version" --notes "Compilation n°${{ github.run_number }}"
